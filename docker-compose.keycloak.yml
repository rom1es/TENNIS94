services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: tennis94-keycloak
    restart: unless-stopped
    network_mode: host
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5432/kcdb
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: kc123AIN
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev --http-port=8080 --http-host=0.0.0.0
